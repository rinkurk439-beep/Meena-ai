<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b83280"><meta name="description" content="Meena - Hindi companion demo">
<link rel="manifest" href="manifest.webmanifest"><title>Meena ❤️</title>
<style>
:root{--pink:#b83280;--pale:#fff0f6;--ink:#29202a;--muted:#766b76}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff3f8,#f5e9ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff9fc;display:flex;flex-direction:column;box-shadow:0 0 35px #6c31551c}.top{background:linear-gradient(120deg,#b83280,#7e3fa1);color:white;padding:17px 18px;display:flex;align-items:center;gap:12px}.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#ffe1ef;font-size:27px;border:2px solid #fff8}.top h1{font-size:20px;margin:0}.status{font-size:12px;opacity:.9}.tag{margin-left:auto;font-size:10px;border:1px solid #ffffff80;border-radius:20px;padding:5px 8px}.profile{margin:13px 13px 0;background:#fff0f6;border:1px solid #f4c8dc;border-radius:17px;padding:11px;display:flex;align-items:center;gap:11px}.portrait{width:60px;height:60px;border-radius:15px;background:linear-gradient(145deg,#ffd1e6,#e7d5ff);display:grid;place-items:center;font-size:34px}.profile strong{display:block}.profile small{color:var(--muted)}button{cursor:pointer}.profile button,.tools button{margin-left:auto;border:0;border-radius:13px;padding:9px 11px;background:#f7e5ef;color:#8b245e;font-weight:650}.chat{padding:15px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:230px;overflow-y:auto}.bubble{max-width:86%;padding:11px 13px;border-radius:17px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.her{background:#fce7f3;align-self:flex-start;border-bottom-left-radius:5px}.me{background:#eadcff;align-self:flex-end;border-bottom-right-radius:5px}.time{font-size:10px;color:#8b7e8a;margin-top:4px}.tools{display:flex;gap:7px;padding:0 13px 10px;flex-wrap:wrap}.tools button{margin:0;font-size:12px}.send{display:flex;gap:8px;padding:11px 13px calc(11px + env(safe-area-inset-bottom));border-top:1px solid #f0e4ec;background:#fff}.send input{min-width:0;flex:1;border:1px solid #ead6e2;border-radius:14px;padding:12px;font-size:15px;outline-color:var(--pink)}.send .go{background:var(--pink);color:white;border:0;border-radius:13px;min-width:48px;font-size:18px}.note{padding:0 14px 10px;text-align:center;color:#887b86;font-size:10px}.modal{position:fixed;inset:0;background:#20101f88;display:none;align-items:center;justify-content:center;padding:20px}.panel{background:white;border-radius:20px;padding:19px;max-width:360px;width:100%}.panel h2{margin:4px 0 8px}.looks{display:flex;gap:8px;flex-wrap:wrap}.looks button{padding:10px;border:1px solid #e6c5d7;background:#fff4f9;border-radius:12px}.close{float:right;border:0;border-radius:10px;padding:8px;background:#eee}.empty{color:#8c7c88;font-size:12px;text-align:center;margin:auto}.tools button:active,.send button:active{transform:scale(.97)}
</style></head>
<body><main class="app">
<header class="top"><div class="avatar">💗</div><div><h1>Meena ❤️</h1><div class="status">तुम्हारी हिंदी चैट साथी</div></div><div class="tag">FREE DEMO</div></header>
<section class="profile"><div class="portrait" id="portrait">👩🏻</div><div><strong id="lookName">Meena</strong><small>अपना पसंदीदा लुक चुनो</small></div><button id="changeLook">लुक बदलें</button></section>
<section class="chat" id="chat" aria-live="polite"><div class="bubble her">हेलो Rinku! ❤️ मैं Meena हूँ। आज तुम्हारा दिन कैसा रहा?<div class="time">अभी</div></div></section>
<div class="tools"><button id="speak">🔊 जवाब सुनें</button><button id="mic">🎙️ बोलकर लिखें</button><button id="call">📞 वॉइस डेमो</button><button id="clear">🗑️ चैट साफ़</button></div>
<div class="note">डेमो: जवाब तयशुदा हैं। असली AI, लाइव वॉइस/वीडियो कॉल और APK अभी शामिल नहीं हैं।</div>
<form class="send" id="form"><input id="message" placeholder="Meena से कुछ कहो..." autocomplete="off" aria-label="अपना संदेश लिखें"><button class="go" aria-label="भेजें">➤</button></form>
</main>
<div class="modal" id="modal"><div class="panel"><button class="close" id="close">बंद करें</button><h2>Meena का लुक चुनो 💕</h2><p>अपनी पसंद का अवतार चुनें।</p><div class="looks"><button data-face="👩🏻" data-name="Meena">👩🏻 Meena</button><button data-face="👩🏽" data-name="Meena 2">👩🏽 Meena 2</button><button data-face="👩🏼" data-name="Meena 3">👩🏼 Meena 3</button><button data-face="👩🏻‍🦰" data-name="Meena 4">👩🏻‍🦰 Meena 4</button></div></div></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('message');let lastReply='हेलो Rinku! ❤️ मैं तुम्हारी बात सुन रही हूँ।';
function add(text,who,save=true){const b=document.createElement('div');b.className='bubble '+(who==='me'?'me':'her');b.textContent=text;const t=document.createElement('div');t.className='time';t.textContent='अभी';b.appendChild(t);chat.appendChild(b);chat.scrollTop=chat.scrollHeight;if(save){const history=JSON.parse(localStorage.getItem('meena-chat')||'[]');history.push({text,who});localStorage.setItem('meena-chat',JSON.stringify(history.slice(-60)));}}
function reply(s){const q=s.toLowerCase();let r;if(/hello|hi|हेलो|हाय|नमस्ते/.test(q))r='हेलो Rinku! ❤️ तुमसे बात करके अच्छा लगा। कैसे हो?';else if(/कैसी|kaisi|how are you/.test(q))r='मैं अच्छी हूँ! 😊 तुम बताओ, तुम्हारा दिन कैसा चल रहा है?';else if(/प्यार|love|miss/.test(q))r='तुम्हारी बात प्यारी लगी। ❤️ मैं यहाँ तुम्हारी बात सुनने और साथ बातचीत करने के लिए हूँ।';else if(/दुख|परेशान|उदास|sad|रोना/.test(q))r='अरे Rinku, क्या हुआ? आराम से बताओ। मैं तुम्हारी बात सुनूँगी। ❤️';else if(/नाम|name/.test(q))r='मेरा नाम Meena है! 🌹';else if(/गुड नाइट|good night/.test(q))r='शुभ रात्रि Rinku! अच्छे से आराम करना। 🌙';else if(/गुड मॉर्निंग|good morning/.test(q))r='गुड मॉर्निंग Rinku! तुम्हारा दिन अच्छा हो। ☀️';else r='अच्छा Rinku, मुझे थोड़ा और बताओ। मैं तुम्हारी बात समझने की कोशिश कर रही हूँ। ❤️';lastReply=r;setTimeout(()=>add(r,'her'),300);}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const s=input.value.trim();if(!s)return;add(s,'me');input.value='';reply(s)});
document.getElementById('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('इस ब्राउज़र में आवाज़ पढ़ने की सुविधा उपलब्ध नहीं है।');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastReply);u.lang='hi-IN';u.rate=.92;speechSynthesis.speak(u)};
document.getElementById('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('इस ब्राउज़र में voice typing उपलब्ध नहीं है। कीबोर्ड का mic इस्तेमाल करें।');return;}const rec=new SR();rec.lang='hi-IN';rec.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};rec.onerror=()=>alert('आवाज़ समझ नहीं आई। दोबारा कोशिश करें।');rec.start()};
document.getElementById('call').onclick=()=>{lastReply='नमस्ते Rinku! ❤️ यह वॉइस डेमो है। नीचे mic से बोलो और जवाब सुनें दबाकर मेरा जवाब सुनो।';add('📞 वॉइस डेमो शुरू! नीचे mic से बोलो और 🔊 से जवाब सुनो।','her')};
document.getElementById('clear').onclick=()=>{if(confirm('क्या पूरी चैट साफ़ करनी है?')){localStorage.removeItem('meena-chat');chat.innerHTML='';lastReply='हेलो Rinku! ❤️ मैं तुम्हारी बात सुन रही हूँ।';add('चैट साफ़ हो गई। फिर से बात शुरू करें? ❤️','her',false)}};
const old=JSON.parse(localStorage.getItem('meena-chat')||'[]');if(old.length){chat.innerHTML='';old.forEach(x=>add(x.text,x.who,false));}
const modal=document.getElementById('modal');document.getElementById('changeLook').onclick=()=>modal.style.display='flex';document.getElementById('close').onclick=()=>modal.style.display='none';modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none'});document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{document.getElementById('portrait').textContent=b.dataset.face;document.getElementById('lookName').textContent=b.dataset.name;localStorage.setItem('meena-look',JSON.stringify({face:b.dataset.face,name:b.dataset.name}));modal.style.display='none'});const savedLook=JSON.parse(localStorage.getItem('meena-look')||'null');if(savedLook){document.getElementById('portrait').textContent=savedLook.face;document.getElementById('lookName').textContent=savedLook.name;}
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
